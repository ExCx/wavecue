name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble, unit test and lint
        run: >-
          ./gradlew :app:assembleDebug testDebugUnitTest :core:model:test lintDebug
          --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wavecue-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumented:
    name: Instrumented tests (API 34)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # GitHub's Linux runners expose /dev/kvm; this rule makes it usable by
      # the unprivileged user that starts the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate fixtures
        run: python3 scripts/qa/make_fixtures.py --out build/qa-fixtures

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            adb wait-for-device
            # The FUSE-backed /sdcard mounts a little after boot on slower runners.
            adb shell 'n=0; until [ -d /sdcard/Download ] || [ $n -ge 120 ]; do n=$((n+1)); sleep 1; done'
            # Keep the launcher's ANR dialog from covering the app under test.
            adb shell settings put global anr_show_ui 0 || true
            adb shell settings put global development_settings_enabled 1 || true
            # Let the first-boot setup and dex2oat settle before hammering the device.
            sleep 30
            adb shell mkdir -p /sdcard/WaveCueFixtures
            adb push build/qa-fixtures/. /sdcard/WaveCueFixtures/
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain --max-workers=2 > build/connected.log 2>&1
            status=$?
            tail -120 build/connected.log
            exit $status

      - name: Report instrumented failures
        if: always()
        run: python3 scripts/qa/summarize_results.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
